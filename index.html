<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Undertow</title>
  <meta name="description" content="Everyone's listening as one living ocean.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2307081a'/%3E%3Cpath d='M3 18c4-8 8-8 13 0s9 8 13 0' fill='none' stroke='%23ffb38a' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="ocean"></canvas>
  <canvas id="overlay" aria-label="A living field of live activity. Each language or listener is a current; similar ones drift together."></canvas>
  <header>
    <div class="brand">
      <h1>Undertow</h1>
      <p id="status">Listening…</p>
    </div>
    <nav>
      <button id="feed" type="button">Music</button>
      <button id="view" type="button" aria-pressed="false">Fur</button>
      <button id="fullscreen" type="button">Fullscreen</button>
      <button id="export" type="button">Save PNG</button>
    </nav>
  </header>
  <div id="tip" hidden></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
